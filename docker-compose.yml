name: mini-security

services:
  api:
    container_name: mini-security-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - '8000:8000'
    env_file:
      - .env
    restart: always

  web:
    container_name: mini-security-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        BACKEND_URL: ${BACKEND_URL:-http://api:8000}
    ports:
      - '3000:3000'
    env_file:
      - .env
    depends_on:
      - api
    restart: always
