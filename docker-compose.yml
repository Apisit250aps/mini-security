name: mini-security

services:
  postgres:
    image: postgres:16-alpine
    container_name: mini-security-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-security}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-security}',
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  db-migrate:
    container_name: mini-security-db-migrate
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: npm run db:migrate --workspace=@repo/database
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-security}
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  api:
    container_name: mini-security-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - '8000:8000'
    environment:
      NODE_ENV: production
      PORT: 8000
      BACKEND_PORT: 8000
      BACKEND_URL: http://api:8000
      BACKEND_ORIGIN: http://localhost:3000
      BACKEND_CORS_ORIGINS: http://localhost:3000
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-super-secret-key-please-change-in-production}
      BETTER_AUTH_URL: http://localhost:8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-security}
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    restart: always

  web:
    container_name: mini-security-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      BACKEND_URL: http://api:8000
    depends_on:
      - api
    restart: always

volumes:
  postgres-data:
