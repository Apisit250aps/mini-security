name: mini-security

services:
  api:
    container_name: mini-security-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    expose:
      - '8000'
    env_file:
      - .env
    restart: always

  web:
    container_name: mini-security-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        BACKEND_URL: ${BACKEND_URL:-http://api:8000}
    expose:
      - '3000'
    env_file:
      - .env
    depends_on:
      - api
    restart: always

  nginx:
    image: nginx:1.28-alpine
    container_name: mini-security-nginx
    ports:
      - '${NGINX_PORT:-8080}:80'
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
    restart: always
