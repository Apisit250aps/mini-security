components:
  schemas:
    ApiErrorResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
        message:
          type: string
        error:
          type: string
      description: Error response returned on failures
    ApiForbiddenResponse:
      type: object
      required:
        - body
      properties:
        body:
          $ref: '#/components/schemas/ApiErrorResponse'
      description: 403 Forbidden — FORBIDDEN
    ApiInternalErrorResponse:
      type: object
      required:
        - body
      properties:
        body:
          $ref: '#/components/schemas/ApiErrorResponse'
      description: 500 Internal Server Error — INTERNAL_ERROR
    AttendanceLog:
      type: object
      required:
        - id
        - createdAt
        - updatedAt
        - companyMemberId
        - scheduleSlotId
        - workDate
        - status
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        companyMemberId:
          type: string
        scheduleSlotId:
          type: string
        workDate:
          type: string
        checkedInAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        status:
          $ref: '#/components/schemas/Domain.Entity.AttendanceStatus'
        note:
          anyOf:
            - type: string
            - type: 'null'
        recordedBy:
          anyOf:
            - type: string
            - type: 'null'
    BasicResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
        message:
          type: string
      description: Successful response without data payload
    CheckInRequest:
      type: object
      required:
        - companyMemberId
      properties:
        companyMemberId:
          type: string
        scheduleSlotId:
          type: string
        note:
          type: string
    CheckInSchedule:
      type: object
      required:
        - id
        - createdAt
        - updatedAt
        - roleId
        - companyId
        - name
        - isActive
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        roleId:
          type: string
        companyId:
          type: string
        name:
          type: string
        isActive:
          type: boolean
    Company:
      type: object
      required:
        - id
        - createdAt
        - updatedAt
        - name
        - slug
        - isActive
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        name:
          type: string
        slug:
          type: string
        logo:
          anyOf:
            - type: string
            - type: 'null'
        isActive:
          type: boolean
    CompanyBranch:
      type: object
      required:
        - id
        - createdAt
        - updatedAt
        - companyId
        - name
        - isActive
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        companyId:
          type: string
        name:
          type: string
        address:
          anyOf:
            - type: string
            - type: 'null'
        isActive:
          type: boolean
    CompanyFeature:
      type: object
      required:
        - id
        - createdAt
        - updatedAt
        - companyId
        - featureId
